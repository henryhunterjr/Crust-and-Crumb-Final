name: Add Ascorbic Acid and Couche photos

on:
  push:
    branches:
      - finish-maceration-photo-release
    paths:
      - '.github/workflows/add-ascorbic-couche-photos.yml'

permissions:
  contents: write

jobs:
  add-photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finish-maceration-photo-release
      - name: Download supplied photos
        run: |
          curl -L --fail --retry 3 "https://at.adobe.com/PRD8C2PYwJFUuKNL" -o /tmp/ascorbic.png
          curl -L --fail --retry 3 "https://at.adobe.com/IVr0v3SMQqAr2zv1" -o /tmp/couche.png
          test -s /tmp/ascorbic.png
          test -s /tmp/couche.png
      - name: Convert to web JPEG
        run: |
          npm install --no-save sharp
          mkdir -p public/photos/glossary
          node <<'NODE'
          const sharp=require('sharp');
          Promise.all([
            sharp('/tmp/ascorbic.png').jpeg({quality:88,mozjpeg:true}).toFile('public/photos/glossary/ascorbic-acid-vitamin-c-bread-baking.jpg'),
            sharp('/tmp/couche.png').jpeg({quality:88,mozjpeg:true}).toFile('public/photos/glossary/bakers-couche-baguette-proofing.jpg')
          ]).catch(err=>{console.error(err);process.exit(1);});
          NODE
      - name: Commit photos
        run: |
          git config user.name "Crust & Crumb release bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/photos/glossary/ascorbic-acid-vitamin-c-bread-baking.jpg public/photos/glossary/bakers-couche-baguette-proofing.jpg
          git commit -m "Add Ascorbic Acid and Baker's Couche photos"
          git push origin HEAD:finish-maceration-photo-release
