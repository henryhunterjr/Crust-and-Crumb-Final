name: Import glossary photo batch

on:
  push:
    branches:
      - photo-glossary-release
    paths:
      - '.github/workflows/import-glossary-photos.yml'

permissions:
  contents: write

jobs:
  import-photos:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: photo-glossary-release
          fetch-depth: 0

      - name: Download supplied photo batch
        run: |
          curl -L --fail --retry 3 "https://at.adobe.com/Ddh4R177XKxC24ku" -o /tmp/glossary-images-batch1.zip
          unzip -q /tmp/glossary-images-batch1.zip -d /tmp/glossary-images
          test -f /tmp/glossary-images/manifest-section1.tsv
          test -f /tmp/glossary-images/manifest-section2.tsv

      - name: Install photos and map them to glossary terms
        run: |
          mkdir -p public/photos/glossary
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const root = '/tmp/glossary-images';
          const publicGlossary = JSON.parse(fs.readFileSync('src/data/public-glossary.json', 'utf8'));
          const illustrationsPath = 'src/data/illustrations.json';
          const illustrations = JSON.parse(fs.readFileSync(illustrationsPath, 'utf8'));

          const normalize = (value) => value
            .toLowerCase()
            .normalize('NFKD')
            .replace(/[’']/g, '')
            .replace(/[^a-z0-9]+/g, ' ')
            .trim()
            .replace(/\s+/g, ' ');

          const nameMap = new Map();
          for (const item of publicGlossary) {
            nameMap.set(normalize(item.term), item.id);
            for (const alias of (item.aliases || [])) {
              if (!nameMap.has(normalize(alias))) nameMap.set(normalize(alias), item.id);
            }
          }

          const special = {
            'Hard Red Wheat': ['hard-red-spring-wheat', 'hard-red-winter-wheat'],
            'Soft Pretzel': ['pretzels'],
            'Milk Bread / Shokupan': ['milk-bread'],
          };

          const manifests = ['manifest-section1.tsv', 'manifest-section2.tsv'];
          const installed = [];
          const unresolved = [];
          const missing = [];

          for (const manifestName of manifests) {
            const lines = fs.readFileSync(path.join(root, manifestName), 'utf8').trim().split(/\r?\n/);
            const headers = lines.shift().split('\t');
            for (const line of lines) {
              if (!line.trim()) continue;
              const cols = line.split('\t');
              const row = Object.fromEntries(headers.map((h, i) => [h, cols[i] || '']));
              if (row.status === 'missing') {
                missing.push(row.filename);
                continue;
              }
              if (row.status !== 'ok') continue;

              const src = path.join(root, row.filename);
              if (!fs.existsSync(src)) {
                unresolved.push({ term: row.glossary_term, reason: 'file not found', filename: row.filename });
                continue;
              }

              let ids = special[row.glossary_term];
              if (!ids) {
                const id = nameMap.get(normalize(row.glossary_term));
                ids = id ? [id] : [];
              }
              if (!ids.length) {
                unresolved.push({ term: row.glossary_term, reason: 'term not matched', filename: row.filename });
                continue;
              }

              const dest = path.join('public/photos/glossary', row.filename);
              fs.copyFileSync(src, dest);

              for (const id of ids) {
                const term = publicGlossary.find(item => item.id === id);
                if (!term) {
                  unresolved.push({ term: row.glossary_term, reason: 'mapped id missing', id, filename: row.filename });
                  continue;
                }
                const existing = illustrations[id];
                const description = row.wanted_description.replace(/\s+/g, ' ').trim();
                illustrations[id] = {
                  src: '/photos/glossary/' + row.filename,
                  alt: term.term + ': ' + description,
                  caption: existing?.caption || description.charAt(0).toUpperCase() + description.slice(1).replace(/[.]?$/, '.'),
                };
                installed.push({ id, term: term.term, filename: row.filename });
              }
            }
          }

          if (unresolved.length) {
            console.error('Unresolved photo mappings:', JSON.stringify(unresolved, null, 2));
            process.exit(1);
          }

          fs.writeFileSync(illustrationsPath, JSON.stringify(illustrations, null, 2) + '\n');
          fs.writeFileSync('reports/glossary-photo-import.json', JSON.stringify({
            installedCount: installed.length,
            uniqueFiles: [...new Set(installed.map(x => x.filename))].length,
            installed,
            intentionallyMissing: missing
          }, null, 2) + '\n');

          console.log('Installed mappings:', installed.length);
          console.log('Unique photo files:', new Set(installed.map(x => x.filename)).size);
          console.log('Intentionally missing:', missing);
          NODE

      - name: Verify production dataset stays at 279 terms and 6 guided paths
        run: |
          node <<'NODE'
          const fs = require('fs');
          const glossary = JSON.parse(fs.readFileSync('src/data/public-glossary.json', 'utf8'));
          if (glossary.length !== 279) {
            throw new Error(`Expected 279 public glossary terms, found ${glossary.length}`);
          }
          const constants = fs.readFileSync('src/constants.ts', 'utf8');
          const pathCount = (constants.match(/id:\s*'[^']+'\s*,\s*\n\s*title:/g) || []).length;
          if (pathCount < 6) {
            throw new Error(`Expected at least 6 guided paths, found ${pathCount}`);
          }
          console.log('Verified 279 public terms; guided path definitions present.');
          NODE

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit photo update
        run: |
          git config user.name "Crust & Crumb release bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/photos/glossary src/data/illustrations.json reports/glossary-photo-import.json
          git commit -m "Replace glossary sketches with real bread photos"
          git push origin HEAD:photo-glossary-release
