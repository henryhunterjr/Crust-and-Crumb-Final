name: Add Wire Monkey banner

on:
  push:
    branches:
      - affiliate-banner-cleanup
    paths:
      - '.github/workflows/add-wiremonkey-banner.yml'

permissions:
  contents: write

jobs:
  add-banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: affiliate-banner-cleanup
      - name: Download banner
        run: |
          mkdir -p public/partners
          curl -L --fail --retry 3 "https://at.adobe.com/i0Wqu3zqY4yhKToX" -o public/partners/wiremonkey-promo-banner.png
          test -s public/partners/wiremonkey-promo-banner.png
      - name: Commit banner
        run: |
          git config user.name "Crust & Crumb release bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/partners/wiremonkey-promo-banner.png
          git commit -m "Add Wire Monkey affiliate banner"
          git push origin HEAD:affiliate-banner-cleanup
